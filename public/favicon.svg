<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E6C200"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0F0F0F"/>
  <!-- Checkmark / Analytics line -->
  <path d="M8 16 L13 21 L24 10" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- AI dot -->
  <circle cx="24" cy="10" r="3" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
