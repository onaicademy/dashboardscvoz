<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowToday AI Analytics</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FFD700'/%3E%3Cstop offset='100%25' stop-color='%23E6C200'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230F0F0F'/%3E%3Cpath d='M8 16 L13 21 L24 10' stroke='url(%23grad)' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='24' cy='10' r='3' fill='%23FFD700'%3E%3Canimate attributeName='opacity' values='1;0.5;1' dur='2s' repeatCount='indefinite'/%3E%3C/circle%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0F0F0F" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#FFD700',
                dark: '#E6C200',
              },
              dark: {
                bg: '#0F0F0F',
                card: '#1A1A1A',
                border: '#2A2A2A',
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }

      /* Custom scrollbar */
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: #CBD5E1;
        border-radius: 20px;
      }
      .dark .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: #374151;
      }

      /* Smooth transitions */
      * {
        transition-property: background-color, border-color, color;
        transition-duration: 150ms;
      }

      /* ===== LIQUID GLASS STYLES ===== */

      /* Professional Glass - основной стиль карточек */
      .liquid-glass {
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 100%);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow:
          0 8px 32px rgba(0,0,0,0.12),
          inset 0 1px 0 rgba(255,255,255,0.2),
          inset 0 -1px 0 rgba(0,0,0,0.05);
      }

      .dark .liquid-glass {
        background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.04) 50%, rgba(255,255,255,0.02) 100%);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow:
          0 8px 32px rgba(0,0,0,0.3),
          inset 0 1px 0 rgba(255,255,255,0.1),
          inset 0 -1px 0 rgba(0,0,0,0.2);
      }

      /* Premium Glass - для важных элементов */
      .premium-glass {
        background: linear-gradient(135deg, rgba(255,215,0,0.15) 0%, rgba(255,215,0,0.05) 100%);
        backdrop-filter: blur(24px) saturate(200%);
        -webkit-backdrop-filter: blur(24px) saturate(200%);
        border: 1px solid rgba(255,215,0,0.3);
        box-shadow:
          0 12px 40px rgba(255,215,0,0.15),
          inset 0 1px 0 rgba(255,255,255,0.3);
      }

      /* Hover Glow Effect */
      .hover-glow {
        position: relative;
        transition: all 0.3s ease;
      }

      .hover-glow::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        background: linear-gradient(135deg, rgba(255,215,0,0.4), rgba(255,215,0,0.1));
        opacity: 0;
        z-index: -1;
        transition: opacity 0.3s ease;
        filter: blur(8px);
      }

      .hover-glow:hover::before {
        opacity: 1;
      }

      /* Rank Glow Colors */
      .rank-s-glow { box-shadow: 0 0 20px rgba(168,85,247,0.4); }
      .rank-a-glow { box-shadow: 0 0 20px rgba(34,197,94,0.4); }
      .rank-b-glow { box-shadow: 0 0 20px rgba(59,130,246,0.4); }
      .rank-c-glow { box-shadow: 0 0 20px rgba(234,179,8,0.4); }
      .rank-d-glow { box-shadow: 0 0 20px rgba(239,68,68,0.4); }

      /* Animated Gradient Background */
      .animated-gradient {
        background: linear-gradient(-45deg, #0F0F0F, #1a1a2e, #16213e, #0F0F0F);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }

      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Pulse Animation for Critical Items */
      .pulse-critical {
        animation: pulseCritical 2s ease-in-out infinite;
      }

      @keyframes pulseCritical {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
        50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
      }

      /* Theme Transition */
      .theme-transition {
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Card Entrance Animation */
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-slide-in {
        animation: slideInUp 0.5s ease-out forwards;
      }

      /* Shimmer Effect for Loading States */
      .shimmer {
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Score Ring Animation */
      .score-ring {
        stroke-dasharray: 283;
        stroke-dashoffset: 283;
        animation: scoreRingFill 1s ease-out forwards;
      }

      @keyframes scoreRingFill {
        to { stroke-dashoffset: 0; }
      }

      /* Floating Animation */
      .float {
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      /* ===== VIEW TRANSITIONS API - Theme Animation ===== */

      /* Disable default view transition animation */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      /* Light to Dark: Dark layer on top, expands */
      html[data-theme-direction="to-dark"]::view-transition-old(root) {
        z-index: 1;
      }
      html[data-theme-direction="to-dark"]::view-transition-new(root) {
        z-index: 9999;
      }

      /* Dark to Light: Dark layer on top, contracts to reveal light */
      html[data-theme-direction="to-light"]::view-transition-old(root) {
        z-index: 9999;
      }
      html[data-theme-direction="to-light"]::view-transition-new(root) {
        z-index: 1;
      }

      /* Smooth icon rotation in theme toggle button */
      .theme-toggle-icon {
        transition: transform 0.3s ease, opacity 0.3s ease;
      }

      .dark .theme-sun {
        transform: rotate(-90deg);
        opacity: 0;
      }

      .dark .theme-moon {
        transform: rotate(0deg);
        opacity: 1;
      }

      :not(.dark) .theme-sun {
        transform: rotate(0deg);
        opacity: 1;
      }

      :not(.dark) .theme-moon {
        transform: rotate(90deg);
        opacity: 0;
      }
    </style>
</head>
  <body class="bg-[#F8FAFC] dark:bg-dark-bg">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
